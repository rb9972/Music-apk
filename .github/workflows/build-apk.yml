name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Extract project
        run: unzip -q SvaraLite-source.zip

      - name: Build Android APK
        working-directory: SvaraLite
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          cp SvaraLite/app/build/outputs/apk/debug/app-debug.apk music-app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify music-app-debug.apk

      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            music-app-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Music App — Android Test Build" \
            --notes "Installable debug APK for personal testing. Android 8 or later."
